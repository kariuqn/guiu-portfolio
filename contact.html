<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - 私のイラストポートフォリオ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- ヘッダーエリア（共通） -->
  <header class="site-header">

  <!-- 上段：サイン（画像ロゴ） -->
  <div class="header-top">
    <a href="index.html">
      <img src="sign.png" alt="サイン" class="site-logo-img">
    </a>
  </div>

  <!-- 下段：左・中央（ナビ）・右（アイコン） -->
  <div class="header-bottom">
    <div class="header-dummy"></div> <!-- 左側の配置用バランスダミー -->

    <!-- 中央：トップ ＆ ギャラリー リンク -->
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Top</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
    </nav>

    <!-- 右側：各種アイコン -->
    <nav class="sns-links">
      <a href="https://www.instagram.com/ユーザーネーム/" target="_blank" rel="noopener noreferrer" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://あなたのショップURL" target="_blank" rel="noopener noreferrer" title="Shop">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>
      <a href="contact.html" title="Contact">
        <i class="fa-solid fa-envelope"></i>
      </a>
    </nav>
  </div>
</header>

  <!-- お問い合わせフォームエリア -->
  <main class="contact-content">
    <h2>Contact</h2>
    <p class="contact-description">イラストのご依頼やお仕事のご相談など、お気軽にお問い合わせください。</p>

    <!-- ※送信先(action)は後でFormspreeなどのURLに書き換えます -->
    <form class="contact-form" action="#" method="POST">
      <div class="form-group">
        <label for="name">お名前 / 貴社名 <span class="required">必須</span></label>
        <input type="text" id="name" name="name" placeholder="山田 太郎" required>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス <span class="required">必須</span></label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="message">ご相談内容・お問い合わせ本文 <span class="required">必須</span></label>
        <textarea id="message" name="message" rows="6" placeholder="ご自由にご記入ください" required></textarea>
      </div>

      <button type="submit" class="submit-btn">送信する</button>
    </form>
  </main>

</body>
</html>
