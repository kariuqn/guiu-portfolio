<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="robots" content="noai, noimageai">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - 私のイラストポートフォリオ</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- ヘッダーエリア（共通） -->
  <header class="site-header">
    <!-- 無断転載・AI学習禁止のテキスト表示 -->
<div class="copyright-notice">
  <p>Unauthorized reproduction and AI training prohibited.</p>
  <p>当サイトの画像の無断転載・無断使用・AI学習を固く禁じます。</p>
</div>

  <!-- 上段：サイン（画像ロゴ） -->
  <div class="header-top">
    <a href="index.html">
      <img src="sign.png" alt="サイン" class="site-logo-img">
    </a>
  </div>

  <!-- 下段：左・中央（ナビ）・右（アイコン） -->
  <div class="header-bottom">
    <div class="header-dummy"></div> <!-- 左側の配置用バランスダミー -->

    <!-- 中央：トップ ＆ ギャラリー リンク -->
    <nav class="main-nav">
      <a href="index.html" class="nav-link">Top</a>
      <a href="gallery.html" class="nav-link">Gallery</a>
    </nav>

    <!-- 右側：各種アイコン -->
    <nav class="sns-links">
      <a href="https://www.instagram.com/ユーザーネーム/" target="_blank" rel="noopener noreferrer" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://あなたのショップURL" target="_blank" rel="noopener noreferrer" title="Shop">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>
      <a href="contact.html" title="Contact">
        <i class="fa-solid fa-envelope"></i>
      </a>
    </nav>
  </div>
</header>

  <!-- お問い合わせフォームエリア -->
  <main class="contact-content">
    <h2>Contact</h2>
    <p class="contact-description">イラストのご依頼やお仕事のご相談など、お気軽にお問い合わせください。</p>

    <!-- action にコピーした Formspree の URL を指定します -->
<form action="https://formspree.io/f/xvzeewko" method="POST">
  
  <div class="form-group">
    <label for="name">お名前</label>
    <!-- name="name" 属性が必須です -->
    <input type="text" id="name" name="name" required>
  </div>

  <div class="form-group">
    <label for="email">メールアドレス</label>
    <!-- name="email" または name="_replyto" にしておくと、返信しやすくなります -->
    <input type="email" id="email" name="email" required>
  </div>

  <div class="form-group">
    <label for="message">お問い合わせ内容</label>
    <!-- name="message" 属性が必須です -->
    <textarea id="message" name="message" rows="5" required></textarea>
  </div>

  <button type="submit">送信する</button>

</form>
  </main>

</body>
</html>
